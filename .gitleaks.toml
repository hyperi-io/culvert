# gitleaks configuration
# Documentation: https://github.com/gitleaks/gitleaks
#
# This extends the default ruleset. Only the allowlist below is customised -
# all default detection rules still apply.
[extend]
useDefault = true

[allowlist]
description = "Allow known-safe fake PEM markers in integration test fixtures"

# Integration tests use fake PEM-framed test payloads (the content between the
# markers is literally 'TEST_*_FOR_CULVERT_INTEGRATION', not a real key).
# These are constants compared against values read back from OpenBao.
paths = [
    '''tests/integration/test_openbao_pki\.py''',
]

# sha256 release checksums for the supply-chain-pinned binaries are public
# integrity data, not secrets - gitleaks' generic-api-key rule matches the
# 64-hex ARG values.
regexTarget = "line"
regexes = [
    '''ARG (OPENVPN_AUTH_OAUTH2|WSTUNNEL)_SHA256_(AMD64|ARM64)=''',
]
