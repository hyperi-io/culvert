[extend]
useDefault = true

[allowlist]
description = "Allow known-safe fake PEM markers in integration test fixtures"

# Fake PEM-framed constants the OpenBao test reads back.
paths = [
    '''tests/integration/test_openbao_pki\.py''',
]

# Public release checksums, which generic-api-key matches as 64 hex characters.
regexTarget = "line"
regexes = [
    '''ARG (OPENVPN_AUTH_OAUTH2|WSTUNNEL)_SHA256_(AMD64|ARM64)=''',
]
