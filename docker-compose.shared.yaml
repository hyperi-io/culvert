# Scale-out override on shared storage. Use with docker-compose.yaml:
#   docker compose -f docker-compose.yaml -f docker-compose.shared.yaml up -d
# Set CULVERT_IMAGE and SHARED_STORAGE_PATH (an NFS, EFS or similar mount) in .env.

services:
  openvpn:
    # Unset, so more than one instance can run.
    container_name: ""

    volumes:
      # The PKI must be shared: every instance signs with the one CA and reads one CRL.
      - ${SHARED_STORAGE_PATH}/pki:/etc/vpn/pki

      - ${SHARED_STORAGE_PATH}/clients:/etc/vpn/clients

      - ${SHARED_STORAGE_PATH}/ccd:/etc/vpn/server/ccd:ro

      # Logs stay local unless you swap in the shared line.
      - openvpn-logs:/var/log/vpn
      # - ${SHARED_STORAGE_PATH}/logs:/var/log/vpn

volumes:
  openvpn-logs:
    name: openvpn-logs-${HOSTNAME:-local}
