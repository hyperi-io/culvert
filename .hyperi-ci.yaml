language: python

# Category 4, general OSS: public, Apache-2.0, container on a public registry.
classification: oss

quality:
  enabled: true
  dep_licenses:
    # This wheel ships no licence file. The text is upstream's, taken at the same version.
    overrides:
      - {name: loguru, version: "0.7.3", licence: MIT, reason: "Q118 A: upstream LICENSE at tag 0.7.3", licence_file: third_party/loguru-0.7.3-LICENSE}
  ignore:
    - tool: semgrep
      ids:
        - dockerfile.security.missing-user-entrypoint.missing-user-entrypoint
        - dockerfile.security.missing-user.missing-user
      reason: >-
        VPN server container: the entrypoint must create TUN devices, program
        iptables NAT, and bind privileged ports, which needs root/NET_ADMIN at
        startup. OpenVPN itself drops to nobody after init; a Dockerfile USER
        would break interface setup.
    - tool: ruff
      ids:
        - S603
        - S606
        - S607
      reason: >-
        The VPN server drives openvpn, wg, iptables, easyrsa and openssl by
        design. Every call passes a list argv with no shell (nothing trips
        S602), and the operator-facing commands exec fixed /usr/local/bin paths.
  python:
    ruff: blocking
    ruff_security: blocking
    # Non-blocking until tests/ is clean under ty.
    ty: warn
    # At zero findings over scripts/ and tests/, so new dead code fails the build.
    vulture: blocking

test:
  enabled: true
  python:
    parallel: auto
  use_tiers: true
  tiers:
    unit:
      enabled: true
      fail_fast: true
    integration:
      enabled: false
    e2e:
      enabled: false
      # E2E tests need Docker + TUN devices and a running dual-container stack.
      # Run locally with: pytest tests/e2e/ -m e2e -v
    k8s:
      enabled: false
      # Cluster tests install the Helm chart on a real cluster, so they need a
      # kubeconfig and site-specific settings that deliberately live outside
      # this repo (tests/k8s/.env, gitignored). They skip without it.
      # Run against your own cluster with: pytest tests/k8s/ -m k8s -v

release:
  enabled: true
  channel: release
  # culvert ships ONLY its GHCR container - it is not a Python package.
  # Opt out of the default PyPI publish while keeping the container.
  destinations:
    python: false
  # The thin chart, assembled from the committed contract on the scalo-service
  # library chart, with version and appVersion taken from the release. culvert
  # has no CLI to emit the contract at release time, so
  # scripts/generate-deploy-artefacts.py writes it and a unit test holds it there.
  helm:
    enabled: true
    contract: deploy/deployment-contract.json
    library: "2.14.15"
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    # Baked into /etc/vpn/VERSION and /etc/vpn/COMMIT for the info gauge's labels.
    build_args:
      VERSION: "{version}"
      COMMIT: "{sha}"
    # The registry page description. As a `--label` it beats the Dockerfile's LABEL.
    labels:
      org.opencontainers.image.description: >-
        The VPN server that installs like a container, because it is one.
        OpenVPN and WireGuard in a single image, each optionally tunnelled over
        HTTPS, with OIDC SSO and external PKI -- docker run it standalone or
        drop it into Kubernetes.
