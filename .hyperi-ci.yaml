language: python

# Category 4, general OSS: public repo, Apache-2.0, publishes its container to
# a public registry. Declared rather than inferred - the repo prefix is a hint
# and nothing more, and every tool that cares about licence, visibility or
# publishing reads this. It matches what is already true: public since
# 2026-08-03, Apache-2.0 in LICENSE, and ghcr.io/hyperi-io/culvert public.
classification: 4

quality:
  enabled: true
  ignore:
    - tool: semgrep
      ids:
        - dockerfile.security.missing-user-entrypoint.missing-user-entrypoint
        - dockerfile.security.missing-user.missing-user
      reason: >-
        VPN server container: the entrypoint must create TUN devices, program
        iptables NAT, and bind privileged ports, which needs root/NET_ADMIN at
        startup. OpenVPN itself drops to nobody after init; a Dockerfile USER
        would break interface setup.
    - tool: ruff
      ids:
        - S603
        - S606
        - S607
      reason: >-
        The VPN server drives openvpn, wg, iptables, easyrsa and openssl by
        design. Every call passes a list argv with no shell (nothing trips
        S602), and the operator-facing commands exec fixed /usr/local/bin paths.
  python:
    ruff: blocking
    bandit: blocking
    # ty (Astral type checker): scripts/ shipped code is clean; tests/ still
    # has a few dynamic-pattern diagnostics, so kept non-blocking for now.
    # Promote to `blocking` once tests/ typing is addressed.
    ty: warn
    # At zero findings over scripts/ and tests/, so new dead code fails the build.
    vulture: blocking

test:
  enabled: true
  use_tiers: true
  tiers:
    unit:
      enabled: true
      fail_fast: true
    integration:
      enabled: false
    e2e:
      enabled: false
      # E2E tests need Docker + TUN devices and a running dual-container stack.
      # Run locally with: pytest tests/e2e/ -m e2e -v
    k8s:
      enabled: false
      # Cluster tests install the Helm chart on a real cluster, so they need a
      # kubeconfig and site-specific settings that deliberately live outside
      # this repo (tests/k8s/.env, gitignored). They skip without it.
      # Run against your own cluster with: pytest tests/k8s/ -m k8s -v

# Top-level container section gates whether the Container job runs in CI
# (python-ci.yml reads container.enabled) and selects build mode.
# `custom` = use the repo's own Dockerfile (template mode would auto-generate
# a Python-project Dockerfile, which doesn't fit a VPN server container).
container:
  enabled: true
  mode: custom

release:
  enabled: true
  channel: release
  # culvert ships ONLY its GHCR container - it is not a Python package.
  # Opt out of the default PyPI publish while keeping the container.
  destinations:
    python: false
  # The chart's version and appVersion come from VERSION, so the release
  # regenerates it after stamping VERSION and commits it back. Without this the
  # chart lags the published image, and tests/unit/test_deploy_artefacts.py
  # fails the first PR after every release.
  stamp_cmd: uv run --frozen --extra dev python scripts/generate-deploy-artefacts.py
  stamp_paths:
    - deploy/helm/culvert/Chart.yaml
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    # Passed through to `docker build --build-arg`. VERSION feeds the
    # Dockerfile's `ARG VERSION`, which otherwise defaults to "dev" and is
    # baked into /etc/vpn/VERSION for runtime inspection.
    build_args:
      VERSION: "{version}"
    # GHCR and most registry UIs show org.opencontainers.image.description on
    # the package page. This label replaces the pyproject description hyperi-ci
    # would otherwise use, and because it arrives as `docker build --label`, a
    # LABEL in the Dockerfile cannot override it.
    labels:
      org.opencontainers.image.description: >-
        The VPN server that installs like a container, because it is one.
        OpenVPN and WireGuard in a single image, each optionally tunnelled over
        HTTPS, with OIDC SSO and external PKI -- docker run it standalone or
        drop it into Kubernetes.
