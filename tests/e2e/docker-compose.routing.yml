# E2E stack for routing control (CULVERT_ROUTING_CONTROL_ENABLED).
#
# Topology proves the three routing-control guarantees with real traffic:
#   client-net   clients dial the server here
#   receiver-net the allowed destination (egress allow-list target)
#   admin-net    admin (in downstream_admin_cidrs) + non-admin (not)
#
# Clients and the receiver sit on separate bridges, so a client only
# reaches the receiver through the tunnel. admin/non-admin add a static
# route to the tunnel subnet to test reverse admin.
services:
  vpn-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: culvert:dev
    container_name: culvert-test-e2e-routing-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    entrypoint: /e2e-init.sh
    command: ["server"]
    volumes:
      - ./server-init.sh:/e2e-init.sh:ro
      - clients:/etc/vpn/clients
    environment:
      CULVERT_PROTOCOL: openvpn
      CULVERT_SERVER_CN: culvert-test-e2e-routing-server
      CULVERT_FULL_TUNNEL: "false"
      # The feature under test.
      CULVERT_ROUTING_CONTROL_ENABLED: "true"
      CULVERT_CLIENT_ISOLATION: "true"
      CULVERT_ALLOWED_DESTINATIONS: "172.29.1.0/24"
      # Only the admin host (.30), NOT the non-admin (.31), may reach back
      # down the tunnels.
      CULVERT_DOWNSTREAM_ADMIN_CIDRS: "172.29.2.30/32"
      # Push the receiver (outbound data) AND the admin net (so appliance
      # replies to admin route back up the tunnel).
      CULVERT_PUSH_ROUTES: "172.29.1.0/24,172.29.2.0/24"
    networks:
      client-net:
        ipv4_address: 172.29.0.10
      receiver-net:
        ipv4_address: 172.29.1.10
      admin-net:
        ipv4_address: 172.29.2.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

  receiver:
    image: nginx:alpine
    container_name: culvert-test-e2e-routing-receiver
    volumes:
      - ./nginx-target.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      receiver-net:
        ipv4_address: 172.29.1.20

  client-a:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: culvert-test-e2e-routing-client-a
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - clients:/etc/vpn/clients:ro
    depends_on:
      vpn-server:
        condition: service_healthy
    networks:
      client-net:
        ipv4_address: 172.29.0.21

  client-b:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: culvert-test-e2e-routing-client-b
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - clients:/etc/vpn/clients:ro
    depends_on:
      vpn-server:
        condition: service_healthy
    networks:
      client-net:
        ipv4_address: 172.29.0.22

  # In downstream_admin_cidrs: may reach back down a tunnel.
  admin:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: culvert-test-e2e-routing-admin
    cap_add:
      - NET_ADMIN
    command: ["sleep", "infinity"]
    networks:
      admin-net:
        ipv4_address: 172.29.2.30

  # NOT in downstream_admin_cidrs: must be denied.
  nonadmin:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: culvert-test-e2e-routing-nonadmin
    cap_add:
      - NET_ADMIN
    command: ["sleep", "infinity"]
    networks:
      admin-net:
        ipv4_address: 172.29.2.31

networks:
  client-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  receiver-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.1.0/24
  admin-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.2.0/24

volumes:
  clients:
