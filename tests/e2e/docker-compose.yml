services:
  vpn-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: culvert:dev
    container_name: culvert-test-e2e-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    entrypoint: /e2e-init.sh
    command: ["server"]
    volumes:
      - ./server-init.sh:/e2e-init.sh:ro
      - clients:/etc/vpn/clients
    environment:
      CULVERT_PROTOCOL: both
      CULVERT_SERVER_CN: vpn-server
      CULVERT_PUSH_ROUTES: "172.30.0.0/24"
      CULVERT_FULL_TUNNEL: "false"
      # Every listener under test is opted in. server-init.sh makes the stunnel and wstunnel pair.
      CULVERT_TCP_ENABLED: "true"
      CULVERT_HTTPS_ENABLED: "true"
      CULVERT_STUNNEL_CERT: /etc/vpn/oauth2-tls/e2e-fullchain.pem
      CULVERT_STUNNEL_KEY: /etc/vpn/oauth2-tls/e2e.key
      CULVERT_WG_HTTPS_TUNNEL_ENABLED: "true"
    networks:
      internal:
        ipv4_address: 172.30.0.10
      external:
        ipv4_address: 172.30.1.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

  target:
    image: nginx:1.30.6-trixie@sha256:eb1c896deef834f4e056829fd6dadac8305501f16cc71ba65fb252c8d0aa168e
    container_name: culvert-test-e2e-target
    volumes:
      - ./nginx-target.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      internal:
        ipv4_address: 172.30.0.20

  vpn-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: culvert-test-e2e-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    # A WireGuard full tunnel needs it, and wg-quick cannot set it inside a container.
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      # A dual-stack client, so the full-tunnel test can see where IPv6 goes.
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    volumes:
      - clients:/etc/vpn/clients:ro
    depends_on:
      vpn-server:
        condition: service_healthy
    networks:
      external:
        ipv4_address: 172.30.1.20

  # A second host: one container cannot hold two tunnels on the same interface name.
  vpn-client-b:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: culvert-test-e2e-client-b
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    volumes:
      - clients:/etc/vpn/clients:ro
    depends_on:
      vpn-server:
        condition: service_healthy
    networks:
      external:
        ipv4_address: 172.30.1.21

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24

volumes:
  clients:
