services:
  vpn-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: culvert:dev
    container_name: e2e-vpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    entrypoint: /e2e-init.sh
    command: ["server"]
    volumes:
      - ./server-init.sh:/e2e-init.sh:ro
      - vpn-clients:/etc/vpn/clients
    environment:
      # Entrypoint reads CULVERT_* via scalo
      CULVERT_PROTOCOL: both
      CULVERT_SERVER_CN: vpn-server
      CULVERT_PUSH_ROUTES: "172.30.0.0/24"
      CULVERT_FULL_TUNNEL: "false"
      # The default server is UDP-only; the e2e stack deliberately opts in to
      # every listener it tests (TCP fallback, HTTPS/stunnel, WG DPI bypass).
      # stunnel cert/key are generated by server-init.sh before the entrypoint
      # runs; wstunnel serves WSS with the same pair.
      CULVERT_TCP_ENABLED: "true"
      CULVERT_HTTPS_ENABLED: "true"
      CULVERT_STUNNEL_CERT: /etc/vpn/oauth2-tls/hyperi-wildcard-fullchain.pem
      CULVERT_STUNNEL_KEY: /etc/vpn/oauth2-tls/hyperi-wildcard.key
      CULVERT_WG_DPI_BYPASS_ENABLED: "true"
      # generate-client.py now uses CULVERT_* via lib.config (no legacy vars needed)
    networks:
      e2e-internal:
        ipv4_address: 172.30.0.10
      e2e-external:
        ipv4_address: 172.30.1.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

  target:
    image: nginx:alpine
    container_name: e2e-target
    volumes:
      - ./nginx-target.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      e2e-internal:
        ipv4_address: 172.30.0.20

  vpn-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: e2e-vpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - vpn-clients:/etc/vpn/clients:ro
    depends_on:
      vpn-server:
        condition: service_healthy
    networks:
      e2e-external:
        ipv4_address: 172.30.1.20

networks:
  e2e-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  e2e-external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24

volumes:
  vpn-clients:
