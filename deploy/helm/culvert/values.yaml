# culvert Helm chart values
#
# AUTOGENERATED from culvert's scalo deployment contract by
# scripts/generate-deploy-artefacts.py -- do not edit by hand.
# Override these values at install time (-f my-values.yaml) instead.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/culvert
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- culvert VPN overlay: the VPN data plane runs as root with NET_ADMIN,
# because OpenVPN and wg-quick create the tun device and program routing and
# NAT. That replaces the generator's non-root floor, so a restricted-
# PodSecurity namespace will reject this pod - give culvert its own namespace
# labelled `pod-security.kubernetes.io/enforce: privileged`.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  # ip_forward lets client traffic route through the pod. It is an unsafe
  # sysctl: allow it on the kubelet (--allowed-unsafe-sysctls net.ipv4.ip_forward)
  # or let the entrypoint set it at runtime (it holds NET_ADMIN).
  sysctls:
    - name: net.ipv4.ip_forward
      value: "1"

# -- culvert VPN overlay: container hardening. Everything dropped except
# NET_ADMIN, which opens and configures the tun device, iptables NAT and
# routing. Add SYS_MODULE too if the host offers OpenVPN DCO kernel offload.
# readOnlyRootFilesystem is NOT set: in local-PKI mode the server mints its CA
# and keys onto the container filesystem. Put that state on a volume first, then
# add `readOnlyRootFilesystem: true` here.
securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_ADMIN
  allowPrivilegeEscalation: false

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Application configuration (mounted as /etc/vpn/profiles/culvert.yaml)
config: {}

# -- culvert VPN overlay: /dev/net/tun host passthrough. Required for OpenVPN
# and WireGuard. On a cluster with a TUN device plugin, disable this and request
# the device resource instead.
tunDevice:
  enabled: true
  hostPath: /dev/net/tun

# -- culvert VPN overlay: CULVERT_* environment. At minimum set
# CULVERT_SERVER_CN to the DNS name clients dial. See .env.example for the full
# catalogue of CULVERT_* knobs and their defaults. NON-SECRET values only --
# these render as plaintext into the Deployment. Secrets go via existingSecret.
env:
  CULVERT_SERVER_CN: vpn.example.com

# -- culvert VPN overlay: name of a pre-created Secret to load as environment
# (envFrom). This is where the SENSITIVE CULVERT_* values belong -- OIDC client
# secret, client-download token, OpenBao token -- so they never land in a
# ConfigMap or a plaintext env value. Create it yourself (External Secrets
# Operator, sealed-secrets, or kubectl) with keys like CULVERT_OAUTH2_CLIENT_SECRET;
# empty string disables the envFrom.
existingSecret: ""

# -- culvert VPN overlay: opt-in listener ports, beyond the always-on OpenVPN
# UDP (1194/udp) and the observability port (9090/tcp). Uncomment the ones whose
# CULVERT_* feature you switch on via `env` above. Each renders a containerPort
# and a matching Service port.
extraPorts: []
  # - name: openvpn-tcp      # CULVERT_TCP_ENABLED=true
  #   port: 1194
  #   protocol: TCP
  # - name: openvpn-https    # CULVERT_HTTPS_ENABLED=true (stunnel DPI bypass)
  #   port: 443
  #   protocol: TCP
  # - name: wireguard        # CULVERT_PROTOCOL=wireguard or both
  #   port: 51820
  #   protocol: UDP
  # - name: wg-dpi           # CULVERT_WG_DPI_BYPASS_ENABLED=true (wstunnel)
  #   port: 4443
  #   protocol: TCP
  # - name: oauth2-udp       # CULVERT_OAUTH2_ENABLED=true
  #   port: 9000
  #   protocol: TCP
  # - name: oauth2-https
  #   port: 9001
  #   protocol: TCP
  # - name: oauth2-tcp
  #   port: 9002
  #   protocol: TCP
  # - name: client-download  # CULVERT_CLIENT_DOWNLOAD_ENABLED=true
  #   port: 8443
  #   protocol: TCP

# -- KEDA autoscaling disabled (no KedaContract on this deployment)
keda:
  enabled: false

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
