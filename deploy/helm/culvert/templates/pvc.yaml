{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# culvert VPN overlay: durable /etc/vpn/pki for local-PKI mode.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "culvert.fullname" . }}-pki
  labels:
    {{- include "culvert.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
