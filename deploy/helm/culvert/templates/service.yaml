apiVersion: v1
kind: Service
metadata:
  name: {{ include "culvert.fullname" . }}
  labels:
    {{- include "culvert.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: 1194
      targetPort: 1194
      protocol: UDP
      name: openvpn-udp
    {{- range .Values.extraPorts }}
    - port: {{ .port }}
      targetPort: {{ .port }}
      protocol: {{ .protocol | default "TCP" }}
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "culvert.selectorLabels" . | nindent 4 }}
