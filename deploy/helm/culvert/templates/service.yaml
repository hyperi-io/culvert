apiVersion: v1
kind: Service
metadata:
  name: {{ include "culvert.fullname" . }}
  labels:
    {{- include "culvert.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  # culvert VPN overlay: restrict who can reach the LB (incl. :9090).
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.loadBalancerIP }}
  # culvert VPN overlay: clients dial a fixed address, so pin it.
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.externalTrafficPolicy }}
  # culvert VPN overlay: Local keeps the client's real source IP and
  # steers each flow at a pod on the receiving node.
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.sessionAffinity }}
  # culvert VPN overlay: pin a client to the pod that accepted it.
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: 1194
      targetPort: 1194
      protocol: UDP
      name: openvpn-udp
    {{- range .Values.extraPorts }}
    - port: {{ .port }}
      targetPort: {{ .port }}
      protocol: {{ .protocol | default "TCP" }}
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "culvert.selectorLabels" . | nindent 4 }}
