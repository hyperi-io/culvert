apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "culvert.fullname" . }}
  labels:
    {{- include "culvert.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.keda.enabled .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "culvert.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "culvert.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "culvert.serviceAccountName" . }}
      # culvert VPN overlay: the VPN never calls the K8s API.
      automountServiceAccountToken: false
      # culvert VPN overlay: pod securityContext (seccomp + routing sysctls).
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # culvert VPN overlay: NET_ADMIN for tun/routing/NAT.
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: openvpn-udp
              containerPort: 1194
              protocol: UDP
            # culvert VPN overlay: opt-in listener ports (default none).
            {{- range .Values.extraPorts }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          # culvert VPN overlay: CULVERT_* env (set CULVERT_SERVER_CN).
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          # culvert VPN overlay: SENSITIVE CULVERT_* from a pre-created Secret.
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/vpn/profiles
              readOnly: true
            # culvert VPN overlay: /dev/net/tun passthrough.
            {{- if .Values.tunDevice.enabled }}
            - name: tun
              mountPath: /dev/net/tun
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "culvert.fullname" . }}-config
        # culvert VPN overlay: /dev/net/tun host device.
        {{- if .Values.tunDevice.enabled }}
        - name: tun
          hostPath:
            path: {{ .Values.tunDevice.hostPath }}
            type: CharDevice
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
