{{- $env := default dict .Values.env }}
{{- $external := or .Values.pkiSecret (eq (default "local" $env.CULVERT_PKI_MODE) "external") }}
{{- $sharedTcKey := or .Values.pkiSecret $env.CULVERT_SECRETS_TC_KEY_PATH }}
{{- $replicas := .Values.replicaCount }}
{{- if .Values.autoscaling.enabled }}{{- $replicas = .Values.autoscaling.minReplicas }}{{- end }}
{{- if .Values.keda.enabled }}{{- $replicas = 2 }}{{- end }}
{{- if and (not $external) (not .Values.persistence.enabled) (gt (int $replicas) 1) }}
{{- fail (printf "culvert: %d replicas with local PKI and no persistence. Each replica would mint its own CA, so clients would trust whichever pod answered first. Either supply shared PKI material (pkiSecret), or set persistence.enabled=true and stay at one replica." (int $replicas)) }}
{{- end }}
{{- if and (gt (int $replicas) 1) (not $sharedTcKey) }}
{{- fail (printf "culvert: %d replicas with no shared tls-crypt-v2 server key. Each replica mints its own, and a client config only works against the replica that issued it, so connections would fail at random. Set pkiSecret to a Secret carrying tc.key, or point env.CULVERT_SECRETS_TC_KEY_PATH at a shared one in your secrets backend." (int $replicas)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "culvert.fullname" . }}
  labels:
    {{- include "culvert.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.keda.enabled .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "culvert.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "culvert.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "culvert.serviceAccountName" . }}
      # culvert VPN overlay: the VPN never calls the K8s API.
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # culvert VPN overlay: IP forwarding in the pod network namespace.
      {{- if .Values.ipForward.enabled }}
      initContainers:
        - name: enable-ip-forward
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sysctl", "-w", "net.ipv4.ip_forward=1"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: openvpn-udp
              containerPort: 1194
              protocol: UDP
            # culvert VPN overlay: opt-in listener ports (default none).
            {{- range .Values.extraPorts }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          # culvert VPN overlay: CULVERT_* env (set CULVERT_SERVER_CN).
          {{- $env := default dict .Values.env }}
          {{- if or $env .Values.pkiSecret }}
          env:
            {{- range $k, $v := $env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # culvert VPN overlay: point external PKI at the mounted
            # Secret. Anything set in `env` above wins, so an operator
            # can fetch from openbao/aws instead.
            {{- if .Values.pkiSecret }}
            {{- $mount := .Values.pkiSecretMountPath }}
            {{- range $k, $v := dict "CULVERT_PKI_MODE" "external" "CULVERT_SECRETS_PROVIDER" "file" "CULVERT_SECRETS_CA_CERT_PATH" (printf "%s/ca.crt" $mount) "CULVERT_SECRETS_SERVER_CERT_PATH" (printf "%s/server.crt" $mount) "CULVERT_SECRETS_SERVER_KEY_PATH" (printf "%s/server.key" $mount) "CULVERT_SECRETS_CRL_PATH" (printf "%s/crl.pem" $mount) "CULVERT_SECRETS_TC_KEY_PATH" (printf "%s/tc.key" $mount) }}
            {{- if not (hasKey $env $k) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
          # culvert VPN overlay: SENSITIVE CULVERT_* from a pre-created Secret.
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/vpn/profiles
              readOnly: true
            # culvert VPN overlay: /dev/net/tun passthrough.
            {{- if .Values.tunDevice.enabled }}
            - name: tun
              mountPath: /dev/net/tun
            {{- end }}
            # culvert VPN overlay: durable PKI (local-PKI mode).
            {{- if .Values.persistence.enabled }}
            - name: pki
              mountPath: /etc/vpn/pki
            {{- end }}
            # culvert VPN overlay: external PKI material (file provider).
            {{- if .Values.pkiSecret }}
            - name: pki-external
              mountPath: {{ .Values.pkiSecretMountPath }}
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "culvert.fullname" . }}-config
        # culvert VPN overlay: /dev/net/tun host device.
        {{- if .Values.tunDevice.enabled }}
        - name: tun
          hostPath:
            path: {{ .Values.tunDevice.hostPath }}
            type: CharDevice
        {{- end }}
        # culvert VPN overlay: durable PKI (local-PKI mode).
        {{- if .Values.persistence.enabled }}
        - name: pki
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-pki" (include "culvert.fullname" .)) }}
        {{- end }}
        # culvert VPN overlay: external PKI material (file provider).
        {{- if .Values.pkiSecret }}
        - name: pki-external
          secret:
            secretName: {{ .Values.pkiSecret }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
