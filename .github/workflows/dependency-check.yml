name: Dependency Check

on:
  schedule:
    # Run weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-openvpn-auth-oauth2:
    name: Check openvpn-auth-oauth2
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get current version from Dockerfile
        id: current
        run: |
          CURRENT=$(grep 'ARG OPENVPN_AUTH_OAUTH2_VERSION=' Dockerfile | cut -d'"' -f2)
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${CURRENT}"

      - name: Get latest release from GitHub
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/jkroepke/openvpn-auth-oauth2/releases/latest --jq '.tag_name' | sed 's/^v//')
          # The tag name is chosen upstream, and it reaches a shell, a branch
          # name and a URL below. Anything but a plain semver is rejected here
          # rather than carried further.
          if ! printf '%s' "${LATEST}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::upstream tag '${LATEST}' is not a plain semver, refusing to use it"
            exit 1
          fi
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest version: ${LATEST}"

      - name: Compare versions
        id: compare
        # Passed as env rather than interpolated into the script with ${{ }}.
        # An expression is substituted before the shell parses the line, so an
        # upstream-controlled value lands as code; "$VAR" stays data.
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          if [ "${CURRENT}" != "${LATEST}" ]; then
            echo "update_available=true" >> "$GITHUB_OUTPUT"
            echo "New version available: ${LATEST}"
          else
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            echo "Already on latest version"
          fi

      - name: Generate GitHub App Token
        if: steps.compare.outputs.update_available == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create update PR
        if: steps.compare.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.latest.outputs.version }}
          CURRENT: ${{ steps.current.outputs.version }}
        run: |
          # Create branch
          BRANCH="deps/openvpn-auth-oauth2-${VERSION}"
          git checkout -b "${BRANCH}"

          # The Dockerfile pins a SHA256 per architecture and verifies it before
          # dpkg, so bumping the version alone produces a PR whose build always
          # fails on a checksum mismatch. Compute both from the release the bump
          # points at, and fail here rather than leaving a dead PR behind.
          BASE="https://github.com/jkroepke/openvpn-auth-oauth2/releases/download/v${VERSION}"
          for ARCH in amd64 arm64; do
            curl --proto '=https' --tlsv1.2 -fsSL --max-time 120 \
              "${BASE}/openvpn-auth-oauth2_${VERSION}_linux_${ARCH}.deb" \
              -o "/tmp/oauth2-${ARCH}.deb"
          done
          SHA_AMD64=$(sha256sum /tmp/oauth2-amd64.deb | cut -d' ' -f1)
          SHA_ARM64=$(sha256sum /tmp/oauth2-arm64.deb | cut -d' ' -f1)

          # Cross-check against the release's own checksums.txt where it exists,
          # so a tampered download cannot be pinned as authoritative.
          if curl --proto '=https' --tlsv1.2 -fsSL --max-time 60 \
               "${BASE}/checksums.txt" -o /tmp/oauth2-checksums.txt; then
            grep -q "${SHA_AMD64}" /tmp/oauth2-checksums.txt
            grep -q "${SHA_ARM64}" /tmp/oauth2-checksums.txt
            echo "Checksums match the upstream checksums.txt"
          else
            echo "::warning::no checksums.txt for v${VERSION} - SHAs are from the downloads alone"
          fi

          # Update Dockerfile
          sed -i "s/ARG OPENVPN_AUTH_OAUTH2_VERSION=\"${CURRENT}\"/ARG OPENVPN_AUTH_OAUTH2_VERSION=\"${VERSION}\"/" Dockerfile
          sed -i "s/^ARG OPENVPN_AUTH_OAUTH2_SHA256_AMD64=.*/ARG OPENVPN_AUTH_OAUTH2_SHA256_AMD64=\"${SHA_AMD64}\"/" Dockerfile
          sed -i "s/^ARG OPENVPN_AUTH_OAUTH2_SHA256_ARM64=.*/ARG OPENVPN_AUTH_OAUTH2_SHA256_ARM64=\"${SHA_ARM64}\"/" Dockerfile

          # Both ARGs are what the RUN layer's checksum test reads, so if either
          # substitution missed, the build would fail later on a stale SHA.
          grep -q "${SHA_AMD64}" Dockerfile
          grep -q "${SHA_ARM64}" Dockerfile

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: update openvpn-auth-oauth2 to ${VERSION}"
          git push origin "${BRANCH}"

          # Create PR
          gh pr create \
            --title "fix: update openvpn-auth-oauth2 to ${VERSION}" \
            --body "$(cat <<EOF
          ## Summary

          Automated dependency update for openvpn-auth-oauth2.

          - **Current version:** ${CURRENT}
          - **New version:** ${VERSION}
          - **Release notes:** https://github.com/jkroepke/openvpn-auth-oauth2/releases/tag/v${VERSION}

          ## Test Plan

          - [ ] Review release notes for breaking changes
          - [ ] CI build passes
          - [ ] Test VPN connection with OAuth2
          EOF
          )" \
            --base main

          echo "Created PR for version ${VERSION}"
