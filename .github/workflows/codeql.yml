# CodeQL is additive: hyperi-ci already runs semgrep, bandit and gitleaks on
# every push. What this brings is dataflow analysis and results in the repo's
# Security tab, which is where someone evaluating the project looks.
#
# It is free on public repositories and needs GitHub Advanced Security on
# private ones, so the job is gated on visibility - it skips silently while the
# repo is private and starts reporting the moment it is public.

name: CodeQL

# No schedule trigger: the visibility gate reads github.event.repository, which
# a scheduled run's payload does not carry, so a weekly job could not tell
# private from public and would fail on every run until the flip.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          category: /language:${{ matrix.language }}
