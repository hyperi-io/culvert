name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Tag to publish (e.g. v1.3.0)"
      from-head:
        type: string
        required: false
        default: ""
        description: "'true' to release/retry the current HEAD."
      bump:
        type: string
        required: false
        default: "auto"
        description: "from-head version: auto | patch | minor | X.Y.Z (exact)."

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/python-ci.yml@main
    # free mode keeps CI on GitHub-hosted runners, which are free for public
    # repos, rather than drawing on the org's self-hosted pool.
    with:
      runner-mode: free
      # Build the container on pull requests, not only on a publish. Without
      # this the Build and Container jobs are SKIPPED on every PR, so nothing
      # compiles the image before it ships - a PR can show every check green
      # and still contain a container that cannot start. That is not
      # hypothetical: the Ubuntu 26.04 bump passed all checks and died at
      # startup on an easy-rsa incompatibility, and a broken --proxy config
      # reached main the same way.
      #
      # Cheap here because culvert is a source-built Python image with no
      # dist/ binaries, so a non-publish build is constrained to linux/amd64 -
      # arm64 emulation is still paid only on a real release.
      branch-build: "true"
      tag: ${{ inputs.tag || '' }}
      from-head: ${{ inputs.from-head || '' }}
      bump: ${{ inputs.bump || 'auto' }}
    secrets: inherit
