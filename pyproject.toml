[project]
name = "culvert"
version = "0.0.0"
description = "OpenVPN and WireGuard in one container, with OpenVPN reachable over HTTPS and OIDC sign-in."
requires-python = ">=3.14"
license = "Apache-2.0"

# Granular secrets extras: the blanket [secrets] extra pulls GCP, Azure and
# ansible-vault, which no culvert backend uses.
dependencies = [
    "scalo[metrics,secrets-vault,secrets-aws]>=2.31.17,<3",
    # Imported directly in lib/oauth2.py (yaml.safe_dump) and for the profile
    # cascade; also a transitive dep of dynaconf, pinned here so it is declared.
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
secrets-vault = ["scalo[secrets-vault]"]
secrets-aws = ["scalo[secrets-aws]"]
secrets-gcp = ["scalo[secrets-gcp]"]
secrets-azure = ["scalo[secrets-azure]"]
otel = ["scalo[opentelemetry]"]

# A group, not an extra, so `uv run` syncs it by default.
[dependency-groups]
dev = [
    "ruff>=0.17,<0.18",
    "pytest>=9.1,<10",
    # hyperi-ci measures coverage of scripts/ by passing pytest-cov's --cov flags.
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.8,<4",
    # tests/conftest.py builds a real X.509 CRL for the CRL-expiry tests, which
    # shell out to `openssl crl` and so cannot use a stubbed string.
    "cryptography>=50,<51",
    # Deployment-contract generators (contract JSON, compose fragment). Pulls in
    # pydantic. Dev/CI-only: culvert's runtime never imports scalo.deployment.
    "scalo[deployment]>=2.31.17,<3",
]

# A container image, not a Python package: no packages, so setuptools does not
# auto-discover config/ and profiles/.
[tool.setuptools]
packages = []

[tool.ty.environment]
# scripts/ is injected onto sys.path by tests/conftest.py at runtime; tell ty
# so it can resolve the `lib.*` and entrypoint imports under tests/.
extra-paths = ["scripts"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]
# vulture's own codes, so its `# noqa: V1xx` marks are not reported as invalid.
external = ["V"]

[tool.ruff.lint.isort]
force-single-line = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "e2e: end-to-end tests requiring Docker (deselect with -m 'not e2e')",
    "k8s: tests that install the Helm chart on a real cluster; needs a kubeconfig and CULVERT_K8S_* settings, never runs in CI (deselect with -m 'not k8s')",
]
# A deprecation in our own code fails the suite. Third-party ones are shown, not
# fatal: add a namespace below when a new dependency starts warning.
filterwarnings = [
    "error::DeprecationWarning",
    "default::DeprecationWarning:scalo.*",
    "default::DeprecationWarning:dynaconf.*",
]
