#  Project:      culvert
#  File:         pyproject.toml
#  Purpose:      Project metadata, ruff and pytest configuration
#  Language:     TOML
#
#  License:      Apache-2.0
#  Copyright:    (c) 2026 HYPERI PTY LIMITED

# Buildable so the `culvert` console script (project.scripts, below) is
# installed under `uv sync` - hyperi-ci's deployment-artefact stage invokes
# it. The image does NOT install this package; it uses requirements-docker.txt.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "culvert"
version = "0.0.0"
description = "Culvert — OpenVPN + WireGuard with DPI bypass, OIDC SSO, and external PKI"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

# Granular secrets extras on purpose: culvert's backends are file (core,
# no extra), openbao (secrets-vault) and aws (secrets-aws). The blanket
# [secrets] extra would drag in ansible-vault + GCP + Azure (~180MB) that
# no culvert backend uses.
dependencies = [
    "scalo[metrics,secrets-vault,secrets-aws]>=2.29.10,<3",
    # Imported directly in lib/oauth2.py (yaml.safe_dump) and for the profile
    # cascade; also a transitive dep of dynaconf, pinned here so it is declared.
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
secrets-vault = ["scalo[secrets-vault]"]
secrets-aws = ["scalo[secrets-aws]"]
secrets-gcp = ["scalo[secrets-gcp]"]
secrets-azure = ["scalo[secrets-azure]"]
otel = ["scalo[opentelemetry]"]
dev = [
    "ruff",
    "pytest",
    # Deployment-contract generators (Helm chart, compose fragment). Pulls in
    # pydantic. Dev/CI-only: culvert's runtime never imports scalo.deployment.
    "scalo[deployment]",
]

# CLI entry point that satisfies hyperi-ci's deployment-artefact stage.
# culvert is a custom-mode container, not a scalo ServiceApp; the entry
# point is a no-op producer (see culvert_ci.py). CI-only - not in the image.
[project.scripts]
culvert = "culvert_ci:main"

# culvert is distributed as a container image, not a Python package.
# Declare no packages so setuptools doesn't auto-discover config/, profiles/
# and fail the build; py-modules ships only culvert_ci so the entry point
# above resolves under `uv sync`. A minimal wheel is built for pipeline parity.
[tool.setuptools]
packages = []
py-modules = ["culvert_ci"]

[tool.ty.environment]
# scripts/ is injected onto sys.path by tests/conftest.py at runtime; tell ty
# so it can resolve the `lib.*` and entrypoint imports under tests/.
extra-paths = ["scripts"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "e2e: end-to-end tests requiring Docker (deselect with -m 'not e2e')",
]
filterwarnings = ["ignore::DeprecationWarning"]
