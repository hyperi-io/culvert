# Single-host deploy: docs/use-case-home.md. Scale-out adds docker-compose.shared.yaml.

services:
  openvpn:
    # No default image: set CULVERT_IMAGE to a digest-pinned image, or uncomment build: below.
    image: ${CULVERT_IMAGE:?set CULVERT_IMAGE to a digest-pinned image}
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-culvert}
    restart: unless-stopped
    # The drain and the children's stop take up to 25 s, past Docker's 10 s default.
    stop_grace_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    # SYS_MODULE is close to host root: uncomment it only to let the container load DCO.
    cap_add:
      - NET_ADMIN
      # - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun

    # IPv4 only: forwarded IPv6 would bypass every routing-control rule.
    sysctls:
      - net.ipv4.ip_forward=1

    # Needed for OIDC discovery.
    dns:
      - ${CULVERT_DNS1:-1.0.0.1}
      - ${CULVERT_DNS2:-1.1.1.1}

    # Uncomment a port AND set its CULVERT_* switch: docs/architecture.md.
    ports:
      - "${CULVERT_UDP_PORT:-1194}:${CULVERT_UDP_PORT:-1194}/udp"
      # Loopback only: /livez and /metrics are unauthenticated.
      - "127.0.0.1:9090:9090/tcp"
      # CULVERT_TCP_ENABLED=true
      # - "${CULVERT_TCP_PORT:-1194}:${CULVERT_TCP_PORT:-1194}/tcp"
      # CULVERT_HTTPS_ENABLED=true
      # - "${CULVERT_HTTPS_PORT:-443}:${CULVERT_HTTPS_PORT:-443}/tcp"
      # CULVERT_PROTOCOL=wireguard or both
      # - "${CULVERT_WG_PORT:-51820}:${CULVERT_WG_PORT:-51820}/udp"
      # CULVERT_WG_HTTPS_TUNNEL_ENABLED=true
      # - "${CULVERT_WG_HTTPS_TUNNEL_PORT:-4443}:${CULVERT_WG_HTTPS_TUNNEL_PORT:-4443}/tcp"
      # CULVERT_OAUTH2_ENABLED=true, one port per OpenVPN listener
      # - "${CULVERT_OAUTH2_UDP_PORT:-9000}:${CULVERT_OAUTH2_UDP_PORT:-9000}/tcp"
      # - "${CULVERT_OAUTH2_HTTPS_PORT:-9001}:${CULVERT_OAUTH2_HTTPS_PORT:-9001}/tcp"
      # - "${CULVERT_OAUTH2_TCP_PORT:-9002}:${CULVERT_OAUTH2_TCP_PORT:-9002}/tcp"
      # CULVERT_CLIENT_DOWNLOAD_ENABLED=true
      # - "${CULVERT_CLIENT_DOWNLOAD_PORT:-8443}:${CULVERT_CLIENT_DOWNLOAD_PORT:-8443}/tcp"

    volumes:
      # Bind mounts, so the CA survives the container being recreated.
      - ${CULVERT_PKI_PATH:-./pki}:/etc/vpn/pki
      - ${CULVERT_CLIENTS_PATH:-./clients}:/etc/vpn/clients
      - ./config/ccd:/etc/vpn/server/ccd:ro
      - ${CULVERT_LOGS_PATH:-./logs}:/var/log/vpn
      # The OIDC callback and stunnel certificates.
      - ${OAUTH2_TLS_CERT_PATH:-/opt/openvpn/certs}:/etc/vpn/oauth2-tls:ro

    # An unset variable passes nothing, so a profile's value stands. A default here would override it.
    environment:
      # Must match DNS and the certificate.
      - CULVERT_SERVER_CN=${CULVERT_SERVER_CN:-vpn.example.com}
      # Address clients dial when it differs from the certificate name
      - CULVERT_EXTERNAL_ENDPOINT

      - CULVERT_UDP_ENABLED
      - CULVERT_UDP_PORT
      - CULVERT_UDP_NETWORK
      - CULVERT_UDP_NETMASK
      - CULVERT_HTTPS_ENABLED
      - CULVERT_HTTPS_PORT
      - CULVERT_HTTPS_NETWORK
      - CULVERT_HTTPS_NETMASK
      - CULVERT_TCP_ENABLED
      - CULVERT_TCP_PORT
      - CULVERT_TCP_NETWORK
      - CULVERT_TCP_NETMASK

      - CULVERT_DNS1
      - CULVERT_DNS2

      - CULVERT_FULL_TUNNEL
      - CULVERT_PUSH_ROUTES
      - CULVERT_DNS_DOMAIN

      # Routing control: docs/use-case-edge-fleet.md.
      - CULVERT_ROUTING_CONTROL_ENABLED
      - CULVERT_CLIENT_ISOLATION
      - CULVERT_ALLOWED_DESTINATIONS
      - CULVERT_DOWNSTREAM_ADMIN_CIDRS

      # On by default: clients cannot reach the cloud metadata service.
      - CULVERT_BLOCK_LINK_LOCAL

      - CULVERT_PROFILE

      # WireGuard: set CULVERT_PROTOCOL=wireguard or both.
      # - CULVERT_PROTOCOL
      # - CULVERT_WG_NETWORK
      # - CULVERT_WG_PORT
      # - CULVERT_WG_MTU
      # - CULVERT_WG_PERSISTENT_KEEPALIVE
      # - CULVERT_WG_HTTPS_TUNNEL_ENABLED
      # - CULVERT_WG_HTTPS_TUNNEL_PORT

      # A label only: docs/performance.md.
      - CULVERT_NETWORK_PROFILE

      - CULVERT_SNDBUF
      - CULVERT_RCVBUF
      - CULVERT_TUN_MTU
      - CULVERT_MSSFIX
      - CULVERT_KEEPALIVE_PING
      - CULVERT_KEEPALIVE_TIMEOUT
      - CULVERT_MAX_CLIENTS
      - CULVERT_RENEG_SEC

      - CULVERT_ALLOW_SHARED_CLIENTS
      - CULVERT_SHARED_CLIENT_SLOTS
      - CULVERT_LOG_MODE
      - CULVERT_VERB
      - CULVERT_MUTE

      - CULVERT_METRICS_ENABLED
      - CULVERT_METRICS_ADDR

      # Needs a bearer token: the configs embed private keys.
      - CULVERT_CLIENT_DOWNLOAD_ENABLED
      - CULVERT_CLIENT_DOWNLOAD_PORT
      - CULVERT_CLIENT_DOWNLOAD_TOKEN
      # Loopback unless set. The TLS pair is both or neither.
      - CULVERT_CLIENT_DOWNLOAD_BIND
      - CULVERT_CLIENT_DOWNLOAD_TLS_CERT
      - CULVERT_CLIENT_DOWNLOAD_TLS_KEY

      - CULVERT_OTEL_ENABLED
      - CULVERT_OTEL_ENDPOINT
      - CULVERT_OTEL_PROTOCOL

      # CULVERT_ORG_NAME names the CA "<org> VPN CA", and CULVERT_CA_CN overrides it.
      - CULVERT_ORG_NAME
      - CULVERT_CA_CN
      - CULVERT_KEY_TYPE
      - CULVERT_KEY_SIZE
      # ChaCha20 first leaves CNSA: docs/performance.md.
      - CULVERT_DATA_CIPHERS
      # Local-PKI lifetimes in days: .env.example.
      - CULVERT_CA_EXPIRE_DAYS
      - CULVERT_CERT_EXPIRE_DAYS
      - CULVERT_CRL_DAYS
      # External PKI: .env.example.
      - CULVERT_PKI_MODE
      - CULVERT_SECRETS_PROVIDER
      - CULVERT_SECRETS_CA_CERT_PATH
      - CULVERT_SECRETS_SERVER_CERT_PATH
      - CULVERT_SECRETS_SERVER_KEY_PATH
      - CULVERT_SECRETS_CRL_PATH
      - CULVERT_SECRETS_TC_KEY_PATH

      # OIDC: docs/use-case-corporate.md.
      - CULVERT_OAUTH2_ENABLED
      - CULVERT_OAUTH2_ISSUER
      - CULVERT_OAUTH2_CLIENT_ID
      - CULVERT_OAUTH2_CLIENT_SECRET
      - CULVERT_OAUTH2_VALIDATE_GROUPS
      - CULVERT_OAUTH2_UDP_ENABLED
      - CULVERT_OAUTH2_HTTPS_ENABLED
      - CULVERT_OAUTH2_TCP_ENABLED
      - CULVERT_OAUTH2_UDP_PORT
      - CULVERT_OAUTH2_HTTPS_PORT
      - CULVERT_OAUTH2_TCP_PORT
      - CULVERT_OAUTH2_HTTP_SECRET
      # Add offline_access for IdPs that issue refresh tokens through it.
      - CULVERT_OAUTH2_SCOPES
      # These default to the oauth2-tls mount above.
      - CULVERT_OAUTH2_TLS_CERT=${CULVERT_OAUTH2_TLS_CERT:-/etc/vpn/oauth2-tls/fullchain.pem}
      - CULVERT_OAUTH2_TLS_KEY=${CULVERT_OAUTH2_TLS_KEY:-/etc/vpn/oauth2-tls/privkey.pem}
      # A fullchain, so clients can verify the certificate.
      - CULVERT_STUNNEL_CERT=${CULVERT_STUNNEL_CERT:-/etc/vpn/oauth2-tls/fullchain.pem}
      - CULVERT_STUNNEL_KEY=${CULVERT_STUNNEL_KEY:-/etc/vpn/oauth2-tls/privkey.pem}
      # An empty CULVERT_OAUTH2_ASSETS_PATH replaces the built-in branding with nothing.
      - CULVERT_OAUTH2_TEMPLATE
      - CULVERT_OAUTH2_ASSETS_PATH

      - TZ=${TZ:-Australia/Sydney}

    # The image's HEALTHCHECK covers every protocol.

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Opt-in image updates: docker compose --profile watchtower up -d.
  watchtower:
    # docker.sock is root on the host: keep this profile opt-in and the tag pinned.
    image: nickfedor/watchtower:1.24.0@sha256:e96976bcbeaf0a9adeddc9016a539c27a2245ef6bb7d3ca97ed106783350d387
    container_name: watchtower
    restart: unless-stopped
    profiles:
      - watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - TZ=${TZ:-Australia/Sydney}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

