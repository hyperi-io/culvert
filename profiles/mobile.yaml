# Tuning for constrained or extra-encapsulated paths: docs/performance.md. Load with CULVERT_PROFILE=mobile.

network_profile: mobile   # label only

# ChaCha20 first leaves the CNSA 2.0 / FIPS suite: docs/performance.md.
data_ciphers: "CHACHA20-POLY1305:AES-256-GCM"

# OpenVPN
sndbuf: 393216
rcvbuf: 393216
tun_mtu: 1400
mssfix: 1400
keepalive_ping: 30
keepalive_timeout: 120

# WireGuard
wg_mtu: 1280   # the IPv6 minimum, so it passes a ~1400 NAT64/CGNAT/PPPoE path
wg_persistent_keepalive: 25
