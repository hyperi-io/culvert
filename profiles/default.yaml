# General-purpose tuning baseline: docs/performance.md. Load with CULVERT_PROFILE=default.

network_profile: default   # label only

data_ciphers: "AES-256-GCM:CHACHA20-POLY1305"

# OpenVPN
sndbuf: 0   # 0 leaves socket buffer sizing to the OS
rcvbuf: 0
tun_mtu: 1500
mssfix: 1420
keepalive_ping: 10
keepalive_timeout: 60

# WireGuard
wg_mtu: 1420
wg_persistent_keepalive: 25
