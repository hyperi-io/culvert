# Appliance fleet into a central receiver, with reverse admin: docs/use-case-edge-fleet.md.
# Load with CULVERT_PROFILE=edge-fleet. Never for laptops on carrier or Starlink links: docs/addressing.md.

protocol: openvpn
udp_enabled: true

udp_network: "100.64.0.0"   # CGNAT range, safe only where the operator owns both ends
udp_netmask: "255.255.255.0"

routing_control_enabled: true
client_isolation: true

# Example CIDRs: set them to yours. push_routes must cover both of the others.
allowed_destinations: "10.20.0.0/16"
downstream_admin_cidrs: "10.10.0.0/16"
push_routes: "10.20.0.0/16,10.10.0.0/16"

log_mode: stdout

pki_mode: local
