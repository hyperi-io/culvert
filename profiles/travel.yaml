# Both tunnels over HTTPS for networks that pass only web traffic: docs/use-case-travel.md.
# Load with CULVERT_PROFILE=travel. The stunnel cert and key come from the environment or a mount.

protocol: both

udp_enabled: true
https_enabled: true
https_port: 443

wg_https_tunnel_enabled: true

full_tunnel: true   # a split tunnel leaks which sites you reach directly

# The mobile profile's values, inlined so this file stands alone.
network_profile: mobile
sndbuf: 393216
rcvbuf: 393216
tun_mtu: 1400
mssfix: 1400
keepalive_ping: 30
keepalive_timeout: 120
wg_mtu: 1280
wg_persistent_keepalive: 25
